<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glassmorphic Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #34d399;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    
    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-glow {
      transform-origin: 950px 180px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .particle {
      animation: floatParticle 8s ease-in-out infinite;
    }
    .p-delayed {
      animation-delay: -4s;
    }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 15s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic / Animated Background Wave Elements -->
  <g class="animated-glow">
    <circle cx="950" cy="180" r="160" fill="url(#glowGrad)" filter="blur(40px)" />
  </g>

  <!-- Animated Flow Lines in Background -->
  <path d="M -50 280 Q 300 340 600 240 T 1250 180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" class="flow-path" />
  <path d="M -50 100 Q 400 20 800 140 T 1250 80" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" class="flow-path" />

  <!-- Background Decorative Graphics -->
  <g transform="translate(820, 60)" opacity="0.85">
    <rect x="70" y="30" width="180" height="180" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <path d="M 160 65 L 210 90 V 135 C 210 165 160 185 160 185 C 160 185 110 165 110 135 V 90 Z" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 140 125 L 155 140 L 180 110" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <g class="particle">
      <rect x="20" y="20" width="60" height="26" rx="13" fill="#10b981" opacity="0.8" />
      <text x="32" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">FHIR</text>
    </g>

    <g class="particle p-delayed">
      <rect x="200" y="190" width="75" height="26" rx="13" fill="#6366f1" opacity="0.8" />
      <text x="212" y="207" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EHR IIS</text>
    </g>
  </g>

  <!-- Main Content Foreground Layer -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="url(#accentGrad)" />
    <text x="16" y="21" class="badge-text">💉 DIGITAL HEALTH &amp; IMMUNIZATION</text>

    <text x="0" y="85" class="title">Awesome Vaccine Administration</text>
    <text x="0" y="130" class="title" fill="#38bdf8">&amp; Management Systems</text>

    <text x="0" y="175" class="subtitle">Curated SaaS Platforms, EHR Immunization Modules &amp; Open-Source EIRs</text>

    <g transform="translate(0, 205)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🏥 8+ Enterprise SaaS</text>

      <rect x="152" y="0" width="150" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="166" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 10+ Open-Source</text>

      <rect x="314" y="0" width="160" height="34" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="328" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ HL7 FHIR &amp; ICE CDS</text>
    </g>
  </g>
</svg>
